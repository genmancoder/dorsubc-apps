<!DOCTYPE html>
<html>
<head>
    <title>Generate PWA Icons</title>
</head>
<body>
    <h1>PWA Icon Generator</h1>
    <p>Right-click each canvas and "Save image as..." to create the icon files.</p>
    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        
        sizes.forEach(size => {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#3B82F6');
            gradient.addColorStop(1, '#8B5CF6');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Draw ticket icon (simple rectangle with notch)
            ctx.fillStyle = 'white';
            const padding = size * 0.2;
            const width = size - padding * 2;
            const height = size - padding * 2;
            
            ctx.fillRect(padding, padding, width, height);
            
            // Add notches
            ctx.fillStyle = gradient;
            const notchSize = size * 0.08;
            ctx.fillRect(padding - notchSize/2, padding + height/2 - notchSize/2, notchSize, notchSize);
            ctx.fillRect(padding + width - notchSize/2, padding + height/2 - notchSize/2, notchSize, notchSize);
            
            // Add text
            ctx.fillStyle = '#3B82F6';
            ctx.font = `bold ${size * 0.15}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('QUEUE', size/2, size/2);
            
            const container = document.createElement('div');
            container.style.margin = '20px';
            const label = document.createElement('p');
            label.textContent = `icon-${size}x${size}.png`;
            container.appendChild(label);
            container.appendChild(canvas);
            document.body.appendChild(container);
        });
    </script>
</body>
</html>
